version: '3.8'

services:
  local:
    image: node:24.13.0-alpine3.22
    build: .
    command: >
      sh -c "npm run dev"
    ports:
      - "3000:3000"
    environment:
      - PG_CONNECTION_LOCAL=postgres://postgres:postgres@db_local:5432/postgres
    env_file:
      - .env
    depends_on:
      - db_local
    networks:
      - local_net
    working_dir: /app
    volumes:
      - .:/app
      - /app/dist
      - /app/node_modules

  db_local:
    image: postgres:17.7
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    expose:
      - 5440
    ports:
      - 5440:5432
    volumes:
      - dbdata:/var/lib/postgresql/data
    restart: always
    networks:
      - local_net

  development:
    container_name: development
    build: .
    image: node:24.13.0-alpine3.22
    command: >
      sh -c "npm run db:migrate
      && node dist/Server.js"
    ports:
      - "3001:3001"
    env_file:
      - .env
    networks:
      - proxy_net
    working_dir: /app
    volumes:
      - .:/app
      - /app/dist
      - /app/node_modules

  proxy_reverse:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    depends_on:
      - development
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - proxy_net

volumes:
  dbdata:
      
networks:
  proxy_net:
    driver: bridge
  local_net:
    driver: bridge