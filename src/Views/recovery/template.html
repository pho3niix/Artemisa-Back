<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <link
      href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/@mdi/font@4.x/css/materialdesignicons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/vuetify@2.x/dist/vuetify.min.css"
      rel="stylesheet"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, minimal-ui"
    />
    <script src="https://cdn.jsdelivr.net/npm/vue@2.x/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuetify@2.x/dist/vuetify.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <title>Recuperación de Contraseña</title>
  </head>

  <body>
    <div id="app">
      <v-app>
        <div
          :style="{
      backgroundColor: '#ffffff',
      display: 'flex',
      justifyContent: 'center',
      alignItems: 'center',
      height: '100vh'
    }"
        >
          <v-alert
            v-model="alert"
            :type="type"
            style="position: absolute; top: 40px; right: 40px"
          >
            {{text}}
          </v-alert>
          <div class="container-password-recovery">
            <div class="container-flex-centered">
              <div>
                <div class="display-flex-vertical-centered mb-9">
                  <div class="image-password-recovery">
                    <img src="" alt="" />
                  </div>
                </div>
                <div class="container-password-recovery-form text-center">
                  <div class="flex-centered-middle-item">
                    <div>
                      <v-text-field
                        v-model="password"
                        name="password"
                        label="Contraseña"
                        :append-icon="bShowPassword ? 'mdi-eye' : 'mdi-eye-off'"
                        @click:append="() => (bShowPassword = !bShowPassword)"
                        :type="bShowPassword ? 'text' : 'password'"
                        outlined
                        clearable
                        color="#000000"
                        dense
                        class="form-input-login"
                        placeholder="Contraseña"
                        persistent-placeholder
                      >
                      </v-text-field>
                      <v-text-field
                        v-model="confirmPassword"
                        name="confirmPassword"
                        label="Confirmar contraseña"
                        :append-icon="bShowConfirmPassword ? 'mdi-eye' : 'mdi-eye-off'"
                        @click:append="() => (bShowConfirmPassword = !bShowConfirmPassword)"
                        :type="bShowConfirmPassword ? 'text' : 'password'"
                        outlined
                        clearable
                        color="#000000"
                        dense
                        class="form-input-login"
                        placeholder="Confirmar contraseña"
                        persistent-placeholder
                      >
                      </v-text-field>
                    </div>
                  </div>
                  <div class="flex-centered-middle-item">
                    <v-btn
                      class="button-password-recovery"
                      @click="passwordRecovery"
                      :disabled="!validateForm"
                      :loading="loadingForm"
                    >
                      Enviar
                    </v-btn>
                  </div>
                  <p class="powerby">
                    Powered by
                    <br />
                    <span class="boldtext">Zeus</span>
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </v-app>
    </div>

    <style scoped>
      #app {
        height: 100%;
      }

      .container-password-recovery {
        background-color: #f9f9f9;
        box-shadow: 0 2px 5px 0 rgba(0, 0, 0, 0.14);
        border-radius: 12px;
        width: 396px;
        height: 80vh;
      }

      .container-flex-centered {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
        position: relative;
      }

      .display-flex-vertical-centered {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .image-password-recovery {
        width: 171px;
        height: 61px;
      }

      .image-password-recovery img {
        width: 100%;
        height: auto;
      }

      @supports (object-fit: cover) {
        .image-password-recovery img {
          height: auto;
          object-fit: cover;
          object-position: center center;
          border-radius: 12px;
        }
      }

      @media (max-width: 600px) {
        .container-password-recovery {
          width: 90%;
        }
      }

      .container-password-recovery-form {
        width: 100%;
        padding: 25px;
      }

      .form-input-password-recovery >>> .v-input__slot {
        background-color: #f0f0f0;
        border-radius: 12px;
      }

      .form-input-password-recovery {
        width: 269px;
      }

      .button-olvidaste-contrasena {
        padding: 0px !important;
        text-transform: capitalize;
        color: #3fd25f !important;
        font-family: "mtserr", sans-serif;
        font-size: 14px;
        letter-spacing: 0;
        font-weight: bold;
      }

      .button-password-recovery {
        margin-top: 30px;
        /* height: 49px !important; */
        width: 250px;
        border-radius: 5px;
        background-color: #292929 !important;
        font-family: "mtserr", sans-serif;
        color: #ffffff !important;
        font-weight: bold;
        letter-spacing: 0.13px;
        font-size: 14px;
      }

      .powerby {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 8%;
        margin: auto;
        font-family: "Poppins", sans-serif;
        color: #c7cfd6;
        font-size: 11px;
        letter-spacing: 0.2px;
        line-height: 17px;
      }

      .boldtext {
        font-weight: bold;
        font-size: 18px;
      }

      .welcome-text-password-recovery {
        color: #000000;
        font-family: "mtserr", sans-serif;
        font-size: 24px;
        letter-spacing: 0;
        margin-bottom: 40px;
        margin-top: 50px;
      }

      .flex-centered-middle-item {
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>

    <script>
      var params = {};
      location.search
        .slice(1)
        .split("&")
        .forEach(function (pair) {
          pair = pair.split("=");
          params[decodeURIComponent(pair[0])] = decodeURIComponent(pair[1]);
        });
      new Vue({
        el: "#app",
        vuetify: new Vuetify(),
        data() {
          return {
            screenWidth: 0,
            screenHeight: 0,
            password: "",
            confirmPassword: "",
            bShowPassword: false,
            bShowConfirmPassword: false,
            loadingForm: false,
            texts: "",
            alert: false,
            type: "error",
            text: "hola hugo"
          };
        },
        created() {
          window.addEventListener("resize", this.handleResize);
          this.handleResize();
        },
        destroyed() {
          window.removeEventListener("resize", this.handleResize);
        },
        methods: {
          handleResize() {
            this.screenHeight = window.innerHeight + "px";
            this.screenWidth = window.innerWidth + "px";
          },
          passwordRecovery() {
            this.loadingForm = true;
            const self = this;

            const payload = {
              NewPassword: this.password,
              ConfirmNewPassword: this.confirmPassword,
              TypeUser: params.TypeUser
            };

            axios
              .patch(
                `${params.Host}/api/v1/${params.Lang}/recovery?Token=${params.Token}`,
                payload
              )
              .then((response) => {
                this.loadingForm = false;
                this.alert = true;
                this.type = "success";
                this.text = response.data.message;
                setTimeout(() => {
                  this.alert = false;
                  window.location.href = response.data.results.redirect;
                }, 1500);
              })
              .catch((error) => {
                this.loadingForm = false;
                this.alert = true;
                this.type = "error";
                this.text = error.response.data.message;
                setTimeout(() => {
                  this.alert = false;
                }, 2500);
              });
          }
        },
        computed: {
          validateForm() {
            return (
              this.password !== "" &&
              this.confirmPassword !== "" &&
              this.password !== null &&
              this.confirmPassword !== null
            );
          }
        }
      });
    </script>
  </body>
</html>
